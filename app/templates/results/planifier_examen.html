{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-6 text-white">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                <div>
                    <h2 class="text-2xl font-semibold">Planification des examens</h2>
                    <p class="text-sm text-blue-100 mt-1">Programmez un nouvel examen pour votre filière</p>
                </div>
                <a href="{% url 'dashboard' %}" class="inline-flex items-center gap-2 text-sm font-medium text-white/90 hover:text-white">
                    <i class="fas fa-arrow-left"></i>
                    Retour au tableau de bord
                </a>
            </div>
        </div>

        <div class="p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-sm text-red-600 mt-1">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
                        <i class="fas fa-calendar-plus mr-2"></i>
                        Enregistrer l’examen
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
